<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#08131d"/><text x="100" y="115" fill="#3ee8d1" font-family="Arial" font-size="26" font-weight="700" letter-spacing="6">DAYS 1-5</text><text x="100" y="205" fill="#f4f7fb" font-family="Arial" font-size="64" font-weight="800">Context before speed</text><g font-family="Arial"><g transform="translate(100 315)"><rect width="310" height="360" rx="30" fill="#0d1d29" stroke="#25404e"/><circle cx="65" cy="70" r="30" fill="#3ee8d1"/><text x="65" y="80" text-anchor="middle" font-size="28" font-weight="800" fill="#071019">1</text><text x="40" y="150" fill="#fff" font-size="31" font-weight="700">Business</text><text x="40" y="190" fill="#fff" font-size="31" font-weight="700">context</text><text x="40" y="255" fill="#9fb0bf" font-size="22">How the company wins</text><text x="40" y="290" fill="#9fb0bf" font-size="22">and what customers value</text></g><g transform="translate(465 315)"><rect width="310" height="360" rx="30" fill="#0d1d29" stroke="#25404e"/><circle cx="65" cy="70" r="30" fill="#55bcd4"/><text x="65" y="80" text-anchor="middle" font-size="28" font-weight="800" fill="#071019">2</text><text x="40" y="150" fill="#fff" font-size="31" font-weight="700">Tools and</text><text x="40" y="190" fill="#fff" font-size="31" font-weight="700">access</text><text x="40" y="255" fill="#9fb0bf" font-size="22">Minimum permissions</text><text x="40" y="290" fill="#9fb0bf" font-size="22">with secure handoffs</text></g><g transform="translate(830 315)"><rect width="310" height="360" rx="30" fill="#0d1d29" stroke="#25404e"/><circle cx="65" cy="70" r="30" fill="#f2c85b"/><text x="65" y="80" text-anchor="middle" font-size="28" font-weight="800" fill="#071019">3</text><text x="40" y="150" fill="#fff" font-size="31" font-weight="700">Examples and</text><text x="40" y="190" fill="#fff" font-size="31" font-weight="700">standards</text><text x="40" y="255" fill="#9fb0bf" font-size="22">Show what good work</text><text x="40" y="290" fill="#9fb0bf" font-size="22">looks like in practice</text></g><g transform="translate(1195 315)"><rect width="310" height="360" rx="30" fill="#0d1d29" stroke="#25404e"/><circle cx="65" cy="70" r="30" fill="#ca80ff"/><text x="65" y="80" text-anchor="middle" font-size="28" font-weight="800" fill="#071019">4</text><text x="40" y="150" fill="#fff" font-size="31" font-weight="700">Supervised</text><text x="40" y="190" fill="#fff" font-size="31" font-weight="700">practice</text><text x="40" y="255" fill="#9fb0bf" font-size="22">Explain, demonstrate,</text><text x="40" y="290" fill="#9fb0bf" font-size="22">practice, then review</text></g></g></svg>
