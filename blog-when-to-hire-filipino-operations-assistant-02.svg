  <text x="180" y="230" fill="#f4f7fb" font-family="Arial,Segoe UI,sans-serif" font-size="46" font-weight="800">Handoff Checkpoints</text>
  <circle cx="260" cy="390" r="54" fill="rgba(62,232,209,0.16)" stroke="#4df0da" />
  <circle cx="800" cy="390" r="54" fill="rgba(62,232,209,0.16)" stroke="#4df0da" />
  <circle cx="1340" cy="390" r="54" fill="rgba(248,211,111,0.18)" stroke="#f8d36f" />
  <path d="M314 390h432M854 390h432" stroke="rgba(62,232,209,0.4)" stroke-width="8" stroke-linecap="round" />
  <text x="214" y="398" fill="#f4f7fb" font-family="Arial,Segoe UI,sans-serif" font-size="28" font-weight="800">01</text>
  <text x="754" y="398" fill="#f4f7fb" font-family="Arial,Segoe UI,sans-serif" font-size="28" font-weight="800">02</text>
  <text x="1294" y="398" fill="#f4f7fb" font-family="Arial,Segoe UI,sans-serif" font-size="28" font-weight="800">03</text>
