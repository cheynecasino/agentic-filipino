  <text x="1170" y="510" fill="#f4f7fb" font-family="Arial,Segoe UI,sans-serif" font-size="36" font-weight="700">Team closes loop</text>
  <text x="160" y="594" fill="#98a4b8" font-family="Arial,Segoe UI,sans-serif" font-size="28">Instead of relying on memory, a stronger operations lane protects the work</text>
