  <rect width="1600" height="900" rx="40" fill="url(#afhs2)" />
  <rect x="120" y="140" width="620" height="620" rx="34" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <text x="168" y="218" fill="#f4f7fb" font-family="Arial,Segoe UI,sans-serif" font-size="44" font-weight="800">Response Flow</text>
