  <text x="918" y="344" fill="#f4f7fb" font-family="Arial,Segoe UI,sans-serif" font-size="58" font-weight="800">Speed creates trust</text>
  <text x="918" y="430" fill="#98a4b8" font-family="Arial,Segoe UI,sans-serif" font-size="30">The first reply, the first text, and the first scheduling touch</text>
